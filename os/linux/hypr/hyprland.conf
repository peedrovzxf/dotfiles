exec-once = ~/.config/hypr/scripts/xdg-portal-hyprland.sh
exec-once = ~/.config/hypr/scripts/battery-monitor.sh
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
exec-once = [[ -f ~/.config/hypr/readmode_state ]] && gammastep -O 4500
exec-once = gnome-keyring-daemon --start --components=secrets
exec-once = waybar
exec-once = awww-daemon
exec-once = awww img ~/.config/hypr/wallpaper.jpg

source = ~/.config/hypr/conf/monitors.conf
source = ~/.config/hypr/conf/input.conf
source = ~/.config/hypr/conf/general.conf
source = ~/.config/hypr/conf/misc.conf
source = ~/.config/hypr/conf/decoration.conf
source = ~/.config/hypr/conf/render.conf
source = ~/.config/hypr/conf/animations.conf
source = ~/.config/hypr/conf/dwindle.conf
source = ~/.config/hypr/conf/master.conf
source = ~/.config/hypr/conf/window-rules.conf
source = ~/.config/hypr/conf/binds.conf

xwayland {
  force_zero_scaling = true
}

layerrule = blur on, match:namespace waybar

monitor = eDP-1, 1920x1200, 0x0, 1

# workspace = 1, monitor:HDMI-A-1
# workspace = 2, monitor:eDP-1
# workspace = 3, monitor:eDP-1
# workspace = 4, monitor:HDMI-A-1
#
windowrule {
  name = fl-all-float
  float = on
  no_initial_focus = on
  match:class = ^(fl64.exe)$
}

windowrule {
  name = fl-tooltip-1
  float = on
  no_initial_focus = on
  match:class = ^(fl64.exe)$
  match:title = ^tooltip$
}

windowrule {
  name = fl-confirm
  float = on
  no_initial_focus = on
  match:class = ^(fl64.exe)$
  match:title = ^Confirm$
}

windowrule {
  name = fl-subwindow-1
  float = on
  no_initial_focus = on
  match:class = ^(fl64.exe)$
  match:title = ^$
}

windowrule {
  name = fl-subwindow-bg
  float = on
  no_initial_focus = on
  workspace = special:fl-bg silent
  match:class = ^(fl64.exe)$
  match:title = ^$
}

windowrule {
  name = fl-main
  float = off
  match:class = ^(fl64.exe)$
  match:title = ^(FL Studio 2025)$
}

