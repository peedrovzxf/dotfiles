decoration {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more

    rounding = 0

    # Change transparency of focused and unfocused windows
    # active_opacity = 1.0
    # inactive_opacity = 0.85
    
    blur { 
        enabled = true
        size = 8
        passes = 3
        new_optimizations = true
        noise = 0.01
        contrast = 0.9
        brightness = 0.8
        popups = true
    }

    #drop_shadow = yes
    #shadow_range = 4
    #shadow_render_power = 3
    #col.shadow = rgba(1a1a1aee)
}

