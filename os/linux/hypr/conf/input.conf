# For all categories, see https://wiki.hyprland.org/Configuring/Variables/
input {
    kb_layout = latam
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =

    follow_mouse = 0

    accel_profile = flat
#    force_no_accel = true

    touchpad {
        disable_while_typing = false
        natural_scroll = true
        scroll_factor = 0.2
    }
}

# Example per-device config
# See https://wiki.hyprland.org/Configuring/Keywords/#executing for more
device {
    name = epic mouse V1
    sensitivity = 0
}
